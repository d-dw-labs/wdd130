<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poll-Form</title>
</head>

<body>
    <header>
        <h1>Poll Form</h1>
    </header>
    <main>
        <form>
            <fieldset>
                <legend>Contact Information</legend>
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" required>
                <label for="useremail">Email Address:</label>
                <input type="email" id="useremail" name="useremail" placeholder="jon.doe@email.com" required>
            </fieldset>
            <fieldset>
                <legend>Questions</legend>
                <label for="browser">What is your favourite internet browser?</label>
                <select name="browser" id="browser">
                    <option value="1">Chrome</option>
                    <option value="2">Edge</option>
                    <option value="3">Firefox</option>
                    <option value="4">Brave</option>
                    <option value="5">Zen</option>
                </select>
                <label><input type="checkbox" id="pet" name="pet">Do you have a household pet?</label>
                <label for="places">List the places you have lived:</label>
                <textarea id="places" name="places" rows="5"></textarea>
            </fieldset>
            <button type="submit">Submit Poll</button>
        </form>
    </main>
    <footer>
        <p>&copy;2026 * Dylan De Wit * Ipswich, Australia</p>
    </footer>
</body>

</html>
