<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Wild Water Rafting</title>
  <meta name="description" content="Please feel free to contact us using the information on this page. We would love to hear from you, whether it's for general enquiries, bookings or feedback based on your experience on one of our guided trips!">
  <meta name="author" content="Dylan DeWit">
  <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
  <header class="grid">
    <img src="images/z-wwr-crossedoars.png" alt="Wild Water Rafting logo" width="200">
    <nav class="flex">
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="trips.html">Trips</a>
      <a href="contact.html">Contact Us</a>
    </nav>
  </header>

  <main>
    <section class="contact">
      <h2>Wild Water Rafting</h2>
      <address>256 Kholo Bridge Road<br>
        Kholo, QLD<br>
        +6178326100965<br>
        enquiries@wildwaterrafting.com</address>
    </section>
    <section class="contact-details">
      <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d7838.058088460879!2d152.74870267644934!3d-27.564200127240184!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sau!4v1795726414100!5m2!1sen!2sau" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
      <form>
        <div class="form-item label-narrow">
          <label for="fullname">Full Name:</label>
          <input type="text" id="fullname" name="fullname" required>
        </div>
        <div class="form-item label-narrow">
          <label for="useremail">Email Address:</label>
          <input type="email" id="useremail" name="useremail" placeholder="jon.doe@email.com" required>
        </div>
        <div class="form-item message">
          <label>Message Purpose:</label>
          <div class="radio-group">
            <label><input type="radio" name="message-purpose" value="general-enquiry">General Enquiry</label>
            <label><input type="radio" name="message-purpose" value="reservation-question">Reservation Question</label>
            <label><input type="radio" name="message-purpose" value="website-suggestion">Website Suggestion</label>
          </div>
        </div>
        <div class="form-item message-area">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5"></textarea>
        </div>
        <div class="form-item label-wide">
          <label><input type="checkbox" id="subscribe" name="subscribe">Please Subscribe me to the monthly newsletter</label>
        </div>
        <button type="submit">Get in Touch!</button>
      </form>
    </section>
    <section class="employees">
      <h2>We Are Here to Serve You</h2>
      <figure>
        <img src="images/employee_01.jpg" alt="Wild Waters">
        <figcaption>Mandy - Head Guide</figcaption>
      </figure>
      <figure>
        <img src="images/employee_02.jpg" alt="Boulder Canyon">
        <figcaption>Enrique - Manager</figcaption>
      </figure>
      <figure>
        <img src="images/employee_03.jpg" alt="Whirlpools">
        <figcaption>Destin - Bookings</figcaption>
      </figure>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Wild Water Rafting | Dylan De Wit</p>
    <nav class="socialmedia">
      <a href="https://www.facebook.com"><img src="images/facebook.png" alt="Facebook" width="32" height="32"></a>
      <a href="https://www.instagram.com"><img src="images/instagram.png" alt="Instagram" width="32" height="32"></a>
      <a href="https://www.youtube.com"><img src="images/youtube.png" alt="YouTube" width="32" height="32"></a>
    </nav>
  </footer>
</body>

</html>
